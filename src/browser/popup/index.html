<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi Chrome Bridge</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Pi Chrome Bridge</h1>
        <span id="status" class="status disconnected">Disconnected</span>
      </header>

      <p id="tab-status" class="muted">No tab bound</p>
      <p id="error" class="error" role="alert" hidden></p>

      <section aria-labelledby="pairing-heading">
        <h2 id="pairing-heading">Pair with pi</h2>
        <label for="secret">Pairing secret</label>
        <input id="secret" type="password" autocomplete="off" placeholder="Run /chrome-pair in pi" />
        <label for="port">Local port</label>
        <input id="port" type="number" min="1024" max="65535" value="17373" />
        <button id="pair" type="button">Pair and bind this tab</button>
      </section>

      <section class="actions" aria-label="Bridge actions">
        <button id="bind" type="button" class="secondary">Bind this tab</button>
        <button id="grant-site" type="button" class="secondary">Always allow this site</button>
        <button id="send-selection" type="button" class="secondary">Send selection to pi</button>
        <button id="disconnect" type="button" class="secondary">Disconnect</button>
        <button id="revoke" type="button" class="danger">Revoke pairing</button>
      </section>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>

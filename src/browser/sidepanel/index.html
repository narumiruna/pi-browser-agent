<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi Chrome</title>
  </head>
  <body data-state="idle">
    <header class="app-header">
      <div class="header-row">
        <div class="page-context">
          <svg class="radix-icon page-icon" viewBox="0 0 15 15" aria-hidden="true">
            <circle cx="7.5" cy="7.5" r="6.25" />
            <path d="M1.8 5.5h11.4M1.8 9.5h11.4M7.5 1.25c1.55 1.7 2.3 3.78 2.3 6.25s-.75 4.55-2.3 6.25M7.5 1.25C5.95 2.95 5.2 5.03 5.2 7.5s.75 4.55 2.3 6.25" />
          </svg>
          <div>
            <span class="eyebrow">Current page</span>
            <p id="tab-status" title="">Detecting current page</p>
          </div>
        </div>
        <span class="status-pill">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="run-status" aria-live="polite">Ready</span>
        </span>
        <details class="disclosure account-disclosure">
          <summary
            id="account-menu-trigger"
            class="icon-button account-trigger"
            aria-label="Account and site access"
            title="Account and site access"
          >
            <svg class="radix-icon dot-icon" viewBox="0 0 15 15" aria-hidden="true">
              <circle cx="3" cy="7.5" r="1" />
              <circle cx="7.5" cy="7.5" r="1" />
              <circle cx="12" cy="7.5" r="1" />
            </svg>
          </summary>
          <div class="disclosure-menu account-menu">
            <span id="auth-status" class="auth-status">Not logged in</span>
            <button type="button" id="login" class="menu-item">Log in</button>
            <button type="button" id="refresh-token" class="menu-item" hidden>Refresh credential</button>
            <button type="button" id="logout" class="menu-item" hidden>Log out</button>
            <button type="button" id="grant-site" class="menu-item">Allow current site</button>
          </div>
        </details>
      </div>
    </header>

    <section class="session-panel" aria-label="Sessions">
      <div class="session-row">
        <label for="sessions" class="visually-hidden">Saved sessions</label>
        <select id="sessions" aria-label="Saved sessions"></select>
        <button
          type="button"
          id="new-session"
          class="icon-button"
          aria-label="New session"
          title="New session"
        >
          <svg class="radix-icon" viewBox="0 0 15 15" aria-hidden="true">
            <path d="M7.5 1v13M1 7.5h13" />
          </svg>
        </button>
        <details class="disclosure session-disclosure">
          <summary class="icon-button" aria-label="Session actions" title="Session actions">
            <svg class="radix-icon dot-icon" viewBox="0 0 15 15" aria-hidden="true">
              <circle cx="7.5" cy="3" r="1" />
              <circle cx="7.5" cy="7.5" r="1" />
              <circle cx="7.5" cy="12" r="1" />
            </svg>
          </summary>
          <div class="disclosure-menu session-menu">
            <button type="button" id="rename-session" class="menu-item">Rename session</button>
            <button type="button" id="delete-session" class="menu-item danger">Delete session</button>
            <button type="button" id="clear-sessions" class="menu-item danger">
              Clear all session data
            </button>
          </div>
        </details>
      </div>
    </section>

    <details class="instruction-panel">
      <summary>
        <span>Instructions</span>
        <span class="summary-hint">System and project guidance</span>
      </summary>
      <div class="settings-content">
        <label for="system-prompt">System prompt</label>
        <textarea id="system-prompt" rows="4"></textarea>
        <label for="agent-instructions">AGENTS-style instructions</label>
        <textarea id="agent-instructions" rows="4"></textarea>
        <button type="button" id="save-settings" class="primary">Save instructions</button>
      </div>
    </details>

    <main id="transcript" aria-live="polite" aria-label="Conversation"></main>

    <footer class="composer">
      <label for="prompt" class="visually-hidden">Message</label>
      <div class="composer-shell">
        <div
          id="pasted-images"
          class="pasted-images"
          aria-live="polite"
          hidden
        ></div>
        <textarea id="prompt" rows="2" placeholder="Ask about the current page"></textarea>
        <div class="composer-toolbar">
          <span id="composer-hint">Enter to send · Shift+Enter for a new line</span>
          <div class="row composer-actions">
            <button type="button" id="abort" class="stop-button" hidden>Stop</button>
            <button type="button" id="send" class="primary send-button">
              <span>Send</span>
              <span aria-hidden="true">↑</span>
            </button>
          </div>
        </div>
      </div>
      <p id="error" role="alert"></p>
    </footer>

    <dialog id="confirm-dialog">
      <form method="dialog">
        <h2>Confirm browser action</h2>
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button type="submit" value="cancel" class="subtle">Cancel</button>
          <button type="submit" value="confirm" id="confirm-action" class="primary">
            Confirm
          </button>
        </div>
      </form>
    </dialog>

    <dialog id="login-dialog">
      <h2>OpenAI device login</h2>
      <p>Open the verification page and enter:</p>
      <output id="device-code"></output>
      <div class="dialog-actions">
        <button type="button" id="cancel-login" class="subtle">Cancel</button>
        <button type="button" id="open-verification" class="primary">
          Open verification page
        </button>
      </div>
    </dialog>

    <script type="module" src="./index.ts"></script>
  </body>
</html>

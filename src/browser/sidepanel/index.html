<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi Chrome</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <div>
        <strong>Pi Chrome</strong>
        <span id="run-status" aria-live="polite">Ready</span>
      </div>
      <div class="row wrap">
        <button type="button" id="login">Log in</button>
        <button type="button" id="refresh-token" hidden>Refresh credential</button>
        <button type="button" id="logout" hidden>Log out</button>
        <button type="button" id="grant-site">Allow site</button>
      </div>
      <p id="auth-status">Not logged in</p>
      <p id="tab-status">Detecting current page</p>
    </header>

    <section aria-label="Sessions">
      <div class="row">
        <select id="sessions" aria-label="Saved sessions"></select>
        <button type="button" id="new-session">New</button>
        <button type="button" id="rename-session">Rename</button>
        <button type="button" id="delete-session">Delete</button>
      </div>
      <button type="button" id="clear-sessions" class="danger">Clear all session data</button>
    </section>

    <details>
      <summary>Instructions</summary>
      <label for="system-prompt">System prompt</label>
      <textarea id="system-prompt" rows="4"></textarea>
      <label for="agent-instructions">AGENTS-style instructions</label>
      <textarea id="agent-instructions" rows="4"></textarea>
      <button type="button" id="save-settings">Save for next run</button>
    </details>

    <main id="transcript" aria-live="polite" aria-label="Conversation"></main>

    <footer>
      <label for="prompt">Message</label>
      <textarea id="prompt" rows="4" placeholder="Ask about the current page"></textarea>
      <div class="row wrap">
        <button type="button" id="send" class="primary">Send</button>
        <button type="button" id="steer">Steer</button>
        <button type="button" id="follow-up">Follow up</button>
        <button type="button" id="abort" class="danger">Abort</button>
      </div>
      <p id="error" role="alert"></p>
    </footer>

    <dialog id="confirm-dialog">
      <form method="dialog">
        <h2>Confirm browser action</h2>
        <p id="confirm-message"></p>
        <div class="row">
          <button type="submit" value="cancel">Cancel</button>
          <button type="submit" value="confirm" class="primary">Confirm</button>
        </div>
      </form>
    </dialog>

    <dialog id="login-dialog">
      <h2>OpenAI device login</h2>
      <p>Open the verification page and enter:</p>
      <output id="device-code"></output>
      <div class="row">
        <button type="button" id="open-verification">Open verification page</button>
        <button type="button" id="cancel-login">Cancel</button>
      </div>
    </dialog>

    <script type="module" src="./index.ts"></script>
  </body>
</html>

name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
      # This package is private, so Changesets tags it without reporting an npm publish.
      - name: Check extension release
        if: steps.changesets.outputs['has-changesets'] == 'false'
        id: extension_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq 'pi-browser-agent.zip'; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build extension archive
        if: steps.extension_release.outputs.needed == 'true'
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null; then
            git checkout --detach "$tag"
          fi
          npm ci
          npm run pack
      - name: Create release or upload extension archive
        if: steps.extension_release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          archive=dist/chrome/pi-browser-agent.zip
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive"
          else
            gh release create "$tag" "$archive" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
